site_name: Evolutionary Generation of Illumination-Robust Classical Image-Processing Pipelines for Image Segmentation
site_description: Project documentation for evolutionary generation of illumination-robust classical image-processing pipelines for image segmentation.

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

nav:
  - Project:
      - Overview: index.md
      - Research Background: concepts.md
      - Scope and Research Questions: quickstart.md
      - Team: components.md
  - Research Design:
      - Benchmark and Data: data.md
      - Methodology: training.md
      - Evaluation Plan: primitives.md
  - Website:
      - Preview and Publish: installation.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
